name: Deploy DEV (OIDC -> ACR -> WebApp)

on:
  push:
    branches: ["dev"]

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: f1-fantasy
  WEBAPP_NAME: f1-fantasy-webapp-dev
  RESOURCE_GROUP: f1-fantasy-pwc-db

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name "${{ env.ACR_LOGIN_SERVER%%.* }}"

      - name: Build & Push image (DEV)
        run: |
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:dev-${{ github.sha }} .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:dev-${{ github.sha }}

      - name: Set WebApp container image (DEV)
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --docker-custom-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:dev-${{ github.sha }} \
            --docker-registry-server-url https://$ACR_LOGIN_SERVER

      - name: Restart WebApp (DEV)
        run: az webapp restart --name $WEBAPP_NAME --resource-group $RESOURCE_GROUP
